          };
        }

        if (hasPrior) {
          return {
            type: "Follow-up after verified response",
            reason: "A prior dispute date or certified mail number is listed, so the letter asks for a targeted follow-up review."
          };
        }

        if (draft.recipient === "Collection agency") {
          return {
            type: "Collection agency debt validation letter",
            reason: wantsValidation
              ? "The recipient is a collection agency and the answers focus on validation or collection authority."
              : "The recipient is a collection agency, so the letter requests validation and support for the alleged debt."
          };
        }

        if (draft.recipient === "Original creditor / furnisher") {
          return {
            type: "Direct furnisher dispute letter",
            reason: "The letter is going directly to the company furnishing or maintaining the account information."
          };
        }

        return {
          type: "Credit bureau dispute letter",
          reason: "The recipient is a credit bureau and the answers identify factual reporting problems."
        };
      }

      function validationMessages(draft, recommendation) {
        var messages = [];
        var combinedText = [draft.accountNumber, draft.explanation, draft.advanced.extraNotes].join(" ");
        var scoreOnly = scoreOnlyPatterns.some(function (pattern) { return pattern.test(combinedText); });
        var admission = admissionPatterns.some(function (pattern) { return pattern.test(combinedText); });
        var ssn = /\b\d{3}[- ]?\d{2}[- ]?\d{4}\b/.test(combinedText);
        var noFacts = !hasFactualReason(draft);
        var goodwill = recommendation.type.indexOf("Goodwill") === 0;

        if (noFacts && !goodwill) {
          messages.push("Stop: Select at least one factual issue before generating a legal dispute letter. Accurate negative information generally should not be disputed only because it hurts your score.");
        }
        if (noFacts && goodwill) {
          messages.push("No factual dispute reason is selected. This output will be a goodwill request, clearly labeled as not a legal dispute.");
        }
        if (scoreOnly && !hasFactualReason(draft)) {
          messages.push("Stop: Do not dispute an account only because it is negative or hurts your score. Add a truthful factual error first.");
        } else if (scoreOnly) {
          messages.push("Score impact alone is not a dispute reason. The letter will focus only on the factual issues selected.");
        }
        if (admission) {
          messages.push("Stop: Remove any wording that admits liability, promises payment, or proposes a payment arrangement.");
        }
        if (ssn) {
          messages.push("Stop: Remove the full SSN. Use only last four digits if a partial identifier is needed.");
        }
        if (/identity theft|fraud/i.test(combinedText)) {
          messages.push("This app does not generate identity theft or fraud claims. Keep the letter limited to truthful, documented reporting issues.");
        }
        return unique(messages);
      }

      function buildLetter(draft, recommendation) {
        if (recommendation.type.indexOf("Goodwill") === 0) return buildGoodwillLetter(draft, recommendation);

        var date = new Date().toLocaleDateString();
        var requestedResult = resultSentence(draft.desiredResult);
        var parts = [
          "Date: " + date,
          "",
          "Consumer:",
          senderBlock(),
          "",
          "Recipient:",
          recipientAddressBlock(draft),
          "",
          certifiedMailLine(draft),
          "Subject: " + recommendation.type + " - " + accountReference(draft),
          "Account Reference: " + accountReference(draft),
          "",
          "To Whom It May Concern:",
          "",
          "Dispute Statement",
          openingParagraph(draft, recommendation),
          "",
          "Account Reference",
          "- Item type: " + (draft.itemKind || "Not provided"),
          "- Account / company: " + (draft.accountName || "Not provided"),
          "- Account number or partial reference: " + accountReference(draft),
          "- Claimed balance: " + (draft.claimedBalance || "Not provided"),
          "- Original creditor: " + (draft.originalCreditor || "Not provided"),
          "- Current creditor: " + (draft.advanced.currentCreditor || "Not provided"),
          "- Credit bureau reporting it: " + (draft.bureau || "Not provided"),
          "",
          advancedFacts(draft),
          "",
          "Specific Disputed Information",
          issueBlock(draft),
          "",
          "Short explanation:",
          draft.explanation || "Add a short factual explanation before sending this letter.",
          "",
          "Legal Basis",
          legalBasisBlock(draft, recommendation),
          "",
          requestBlock(draft, recommendation, requestedResult),
          "",
          documentsBlock(draft),
          "",
          nonAdmissionBlock(draft, recommendation),
          "",
          writtenResultsBlock(draft, recommendation),
          "",
          "Sincerely,",
          "",
          "",
          state.personal.fullName || "Signature"
        ];

        return parts.filter(function (line) { return line !== null && line !== undefined && line !== ""; }).join("\n");
      }

      function buildGoodwillLetter(draft, recommendation) {
        return [
          "Date: " + new Date().toLocaleDateString(),
          "",
          "Consumer:",
          senderBlock(),
          "",
          "Recipient:",
          recipientAddressBlock(draft),
          "",
          certifiedMailLine(draft),
          "Subject: Goodwill request - not a legal dispute - " + accountReference(draft),
          "Account Reference: " + accountReference(draft),
          "",
          "To Whom It May Concern:",
          "",
          "Dispute Statement",
          "This is a goodwill request only. I am not claiming in this letter that accurate information is legally inaccurate, and this letter should not be treated as a formal credit reporting dispute.",
          "",
          "I am respectfully asking that you review the account below and consider a discretionary goodwill adjustment if your policies allow it.",
          "",
          "Account Reference",
          "- Item type: " + (draft.itemKind || "Late payment"),
          "- Account / company: " + (draft.accountName || "Not provided"),
          "- Account number or partial reference: " + accountReference(draft),
          "- Credit bureau reporting it: " + (draft.bureau || "Not provided"),
          "",
          "Explanation:",
          draft.explanation || "Add a short explanation before sending this goodwill request.",
          "",
          "Requested action:",
          "- Please consider a goodwill adjustment or courtesy update based on the account history and the facts provided.",
          "- I understand that accurate information may remain on a consumer report and that this request does not require you to make any change.",
          "",
          documentsBlock(draft),
          "",
          "Non-Admission / Rights Reservation",
          "This goodwill request is not an admission of liability, a promise to pay, or a waiver of any rights, claims, defenses, or limitations periods.",
          "",
          "Request for Written Results",
          "Please send your decision in writing to the mailing address listed above.",
          "",
          "Sincerely,",
          "",
          "",
          state.personal.fullName || "Signature"
        ].join("\n");
      }

      function certifiedMailLine(draft) {
        return draft.advanced.certifiedMailNumber ? "Sent via Certified Mail: " + draft.advanced.certifiedMailNumber : "";
      }

      function legalBasisBlock(draft, recommendation) {
        if (recommendation.type === "Collection agency debt validation letter") {
          return "Legal Basis: This request concerns debt validation rights under the Fair Debt Collection Practices Act and applicable debt collection regulations. Please provide validation information for the alleged debt, including the current creditor, the original creditor if different, the amount claimed, an itemization if available, documentation showing authority to collect, and documentation connecting me to the alleged debt.";
        }

        if (recommendation.type === "Direct furnisher dispute letter" || draft.recipient === "Original creditor / furnisher") {
          return "Legal Basis: This is a direct dispute regarding information your company furnished to one or more consumer reporting agencies. Please conduct a reasonable investigation of each disputed data point, including liability, balance, account status, payment history, dates, and any other information bearing on creditworthiness. Correct or delete any information that cannot be verified as accurate, complete, and properly attributable to me.";
        }

        return "Legal Basis: This dispute concerns the accuracy, completeness, and verifiability of information appearing in my consumer report. Under the Fair Credit Reporting Act, please conduct a reasonable reinvestigation and delete or correct any information that cannot be verified as accurate and complete. This reporting may implicate your duties under applicable consumer credit reporting laws if it cannot be verified as accurate and complete.";
      }

      function nonAdmissionBlock(draft, recommendation) {
        if (recommendation.type === "Collection agency debt validation letter") {
          return [
            "Non-Admission / Rights Reservation",
            "This letter is not an admission of liability, a promise to pay, or a waiver of any rights, claims, defenses, or limitations periods."
          ].join("\n");
        }

        return [
          "Non-Admission / Rights Reservation",
          "This letter is not an admission of liability, a promise to pay, or permission to re-age, duplicate, or otherwise change the account in a way that creates inaccurate reporting. I reserve all rights, claims, defenses, and remedies available under applicable law."
        ].join("\n");
      }

      function writtenResultsBlock(draft, recommendation) {
        var lines = [
          "Request for Written Results",
          "Please send written results of your investigation and confirmation of any correction, deletion, update, validation, or continued verification.",
          "Failure to conduct a reasonable investigation and correct inaccurate or unverifiable information may raise compliance concerns under applicable law.",
          "Please preserve all records used to verify the disputed information."
        ];

        if (draft.advanced.previousDisputeDate) {
          lines.splice(2, 0, "Prior dispute date listed in my records: " + draft.advanced.previousDisputeDate + ".");
        }
        if (draft.advanced.certifiedMailNumber) {
          lines.splice(2, 0, "Certified Mail Tracking Number listed in my records: " + draft.advanced.certifiedMailNumber + ".");
        }
        return lines.join("\n\n");
      }

      function openingParagraph(draft, recommendation) {
        if (recommendation.type === "Collection agency debt validation letter") {
          return "I dispute the alleged debt identified below to the extent it is being claimed, collected, or reported inaccurately, incompletely, without adequate validation, or without documented authority to collect. This letter is not an admission of liability, is not a promise to pay, and is not permission to re-age or alter the account in a way that creates inaccurate reporting.";
        }
        if (recommendation.type === "Direct furnisher dispute letter") {
          return "I am submitting this direct dispute concerning information your company furnished or caused to be furnished to one or more consumer reporting agencies. Please conduct a reasonable investigation of each disputed data point using competent records rather than a conclusory or automated verification.";
        }
        if (recommendation.type === "Follow-up after verified response") {
          return "This is a follow-up dispute because the prior response did not meaningfully address the specific factual issues identified below. Please conduct a targeted reinvestigation and address each disputed field directly.";
        }
        if (recommendation.type === "Reinvestigation / method-of-verification style letter") {
          return "I am requesting a reinvestigation and a clear explanation of the method used to verify the disputed information. Please identify the source contacted, the date of contact, the records reviewed, and the procedure used to verify each disputed field.";
        }
        if (recommendation.type === "No-response follow-up letter") {
          return "My records show that a prior dispute was sent, but I do not have a timely, meaningful response that resolves the specific factual issues below. Please correct or delete any information that cannot be verified as accurate, complete, current, and properly attributable to me.";
        }
        return "I am writing to dispute the accuracy, completeness, ownership, and verifiability of the information identified below. Please conduct a reasonable reinvestigation of each disputed data point and correct or delete anything that cannot be verified as accurate, complete, current, and properly attributable to me.";
      }

      function requestBlock(draft, recommendation, requestedResult) {
        if (recommendation.type === "Collection agency debt validation letter") {
          return [
            "Requested action:",
            "- Identify the current creditor and the original creditor if different.",
            "- Provide the amount claimed and an itemization if available, including principal, interest, fees, payments, credits, assignments, or transfers.",
            "- Provide documentation showing your authority to collect this alleged debt.",
            "- Provide documentation connecting me to the alleged debt.",
            "- If you cannot validate the alleged debt or verify the disputed reporting as accurate and complete, cease reporting it or correct/delete the disputed reporting and notify any consumer reporting agency to which you furnished it.",
            "- Do not treat this letter as a payment promise, settlement offer, admission of liability, or waiver of any rights."
          ].join("\n");
        }
        if (recommendation.type === "Direct furnisher dispute letter") {
          return [
            "Requested action:",
            "- Investigate each disputed data field you furnished or caused to be furnished.",
            "- Correct or delete inaccurate, incomplete, unverifiable, obsolete, duplicated, or improperly attributed reporting sent to all consumer reporting agencies.",
            "- Provide written confirmation of the investigation results and identify any corrections transmitted to Experian, Equifax, TransUnion, or any other consumer reporting agency."
          ].join("\n");
        }
        if (recommendation.type === "Reinvestigation / method-of-verification style letter") {
          return [
            "Requested action:",
            "- Identify the source contacted, the date of contact, the documents reviewed, and the procedure used to verify each disputed field.",
            "- Reinvestigate the disputed information using competent records rather than a generic automated verification.",
            "- If the disputed information cannot be verified as accurate, complete, current, and properly attributable to me, delete or correct it and provide written confirmation."
          ].join("\n");
        }
        if (recommendation.type === "No-response follow-up letter") {
          return [
            "Requested action:",
            "- Correct or delete the disputed information because my records do not show a timely, meaningful response to the prior dispute.",
            "- If you believe a timely response was sent, provide a copy of the response and proof of mailing.",
            "- Send updated results in writing and notify every consumer reporting agency that received inaccurate information."
          ].join("\n");
        }
        return [
          "Requested action:",
          "- " + requestedResult,
          "- Review the enclosed supporting documents and investigate each disputed data field identified above.",
          "- If any portion of the reporting is inaccurate, incomplete, unverifiable, obsolete, duplicated, inconsistent, or not properly attributable to me, please correct or delete it.",
          "- Provide written investigation results and a clear description of any correction, deletion, update, or continued verification."
        ].join("\n");
      }

      function issueBlock(draft) {
        if (!draft.wrongs.length) return "Disputed issues:\n- No factual issue selected yet.";
        return "Disputed issues:\n" + draft.wrongs.map(function (id) {
          return "- " + issueSentence(id);
        }).join("\n");
      }

      function issueSentence(id) {
        var map = {
          wrong_balance: "The balance being reported or claimed is inaccurate, inconsistent, or unsupported by the records available to me.",
          not_mine: "The account is not properly attributable to me based on the information being reported.",
          duplicate: "The same debt or account appears to be duplicated or reported more than once.",
          wrong_dates: "One or more dates, including opening, closing, payment, delinquency, assignment, or reporting dates, appear inaccurate or inconsistent.",
          wrong_original_creditor: "The original creditor is wrong, missing, incomplete, or not supported by the available account information.",
          wrong_status: "The account status, payment status, collection status, charge-off status, or reporting status is inaccurate or incomplete.",
          paid_wrong: "The account was paid or settled, but the reporting does not accurately reflect that status.",
          not_validated: "The collector has not provided adequate validation of the alleged debt.",
          no_authority: "The collector has not provided documentation showing authority to collect or report the alleged debt.",
          bureau_mismatch: "The information differs across credit bureaus, which raises accuracy and completeness concerns.",
          too_old: "The account appears too old to report or the reported dates do not support continued reporting.",
          other_error: "There is another factual reporting error described in the explanation section."
        };
        return map[id] || id;
      }

      function advancedFacts(draft) {
        var rows = [];
        if (draft.advanced.dateOpened) rows.push("- Date opened: " + draft.advanced.dateOpened);
        if (draft.advanced.dateClosed) rows.push("- Date closed: " + draft.advanced.dateClosed);
        if (draft.advanced.dateFirstDelinquent) rows.push("- Date first delinquent: " + draft.advanced.dateFirstDelinquent);
        if (draft.advanced.lastPaymentDate) rows.push("- Last payment date: " + draft.advanced.lastPaymentDate);
        if (draft.advanced.previousDisputeDate) rows.push("- Prior dispute date: " + draft.advanced.previousDisputeDate);
        if (draft.advanced.certifiedMailNumber) rows.push("- Certified Mail Tracking Number: " + draft.advanced.certifiedMailNumber);
        if (draft.advanced.extraNotes) rows.push("- Additional notes: " + draft.advanced.extraNotes);
        return rows.length ? "Additional details:\n" + rows.join("\n") : null;
      }

      function documentsBlock(draft) {
        if (!draft.supportingDocs.length) return "Enclosures:\n- Add copies of documents that support the factual issue before mailing.";
        return "Enclosures:\n" + draft.supportingDocs.map(function (doc) {
          return "- " + enclosureLabel(doc);
        }).join("\n");
      }

      function enclosureLabel(doc) {
        var map = {
          "Government ID copy": "Copy of identification",
          "Payment receipt or settlement letter": "Payment or settlement proof",
          "Bureau response": "Prior dispute response"
        };
        return map[doc] || doc;
      }

      function resultSentence(result) {
        if (result === "Correct") return "Correct the inaccurate reporting after a reasonable investigation.";
        if (result === "Delete") return "Delete any information that cannot be verified as accurate, complete, current, and properly attributable to me.";
        if (result === "Validate") return "Provide validation and documentation supporting the reporting or collection claim.";
        if (result === "Update") return "Update the reporting so it accurately reflects the correct account information.";
        return "Investigate the disputed information and send written results explaining the outcome.";
      }

      function senderBlock() {
        var lines = [
          state.personal.fullName || "Your full name",
          state.personal.mailingAddress || "Your mailing address",
          state.personal.cityStateZip || "City, State ZIP"
        ];
        if (state.personal.contact) lines.push("Contact: " + state.personal.contact);
        return lines.join("\n");
      }

      function recipientAddressBlock(draft) {
        if (bureauRecipients[draft.recipient]) return bureauRecipients[draft.recipient];
        if (draft.recipient === "Collection agency") return (draft.accountName || "Collection agency") + "\nMailing address to be added before sending";
        return (draft.accountName || "Original creditor / furnisher") + "\nMailing address to be added before sending";
      }

      function accountReference(draft) {
        return draft.accountNumber || "account reference not provided";
      }

      function hasFactualReason(draft) {
        var explanation = (draft.explanation || "").trim();
        var scoreOnly = scoreOnlyPatterns.some(function (pattern) { return pattern.test(explanation); });
        return draft.wrongs.length > 0 || Boolean(explanation.length >= 12 && !scoreOnly);
      }

      function nextActionFor(letterType) {
        if (letterType === "Collection agency debt validation letter") return "Mail the validation request, keep proof of mailing, and wait for a documented response.";
        if (letterType === "Direct furnisher dispute letter") return "Mail the direct dispute and request written confirmation of any corrections.";
        if (letterType === "Follow-up after verified response") return "Compare the next response against each disputed field and preserve all prior records.";
        if (letterType === "Reinvestigation / method-of-verification style letter") return "Track the method-of-verification response and save all prior letters and responses.";
        if (letterType === "No-response follow-up letter") return "Send the follow-up with proof of the prior mailing and calendar the next deadline.";
        if (letterType.indexOf("Goodwill") === 0) return "Send only if the information is accurate and you are asking for discretionary goodwill.";
        return "Mail the dispute with document copies, keep proof of mailing, and calendar the response deadline.";
      }

      function descriptionForItem(item) {
        var map = {
          "Collection account": "A collector or debt buyer is reporting or collecting.",
          "Charge-off account": "A creditor charged off the account.",
          "Late payment": "A late mark is being reported.",
          "Account that is not mine": "Ownership or responsibility is disputed.",
          "Paid or settled account reporting wrong": "Payment or settlement status is inaccurate.",
          "Duplicate account": "The same account appears more than once.",
          "Other credit report error": "Use for another factual reporting issue."
        };
        return map[item] || "";
      }

      function descriptionForRecipient(recipient) {
        var map = {
          Experian: "Send to Experian.",
          Equifax: "Send to Equifax.",
          TransUnion: "Send to TransUnion.",
          "Collection agency": "Request validation or authority to collect.",
          "Original creditor / furnisher": "Send a direct dispute to the company reporting it."
        };
        return map[recipient] || "";
      }

      function summaryOfWrongs(dispute) {
        if (!dispute.wrongs || !dispute.wrongs.length) return dispute.explanation || "No issue summary entered.";
        return dispute.wrongs.map(function (id) {
          var option = wrongOptions.find(function (item) { return item.id === id; });
          return option ? option.label : id;
        }).join(", ");
      }

      function labelForWrong(id) {
        var option = wrongOptions.find(function (item) { return item.id === id; });
        return option ? option.label : id || "Other factual error";
      }

      function analyzeReportText(text) {
        var fullSsnDetected = /\b\d{3}[- ]?\d{2}[- ]?\d{4}\b/.test(text || "");
        var chunks = splitReportIntoChunks(text || "");
        var items = chunks.map(parseReportChunk).filter(function (item) {
          return item.accountName || item.accountNumber || item.claimedBalance || item.statusReported;
        });
        applyDuplicateFlags(items);
        return {
          fullSsnDetected: fullSsnDetected,
          items: items
        };
      }

      function splitReportIntoChunks(text) {
        var normalized = text.replace(/\r/g, "\n").replace(/\t/g, " ").replace(/[ ]{2,}/g, " ");
        var paragraphs = normalized.split(/\n\s*\n+/).map(function (chunk) { return chunk.trim(); }).filter(Boolean);
        if (paragraphs.length > 1) {
          return paragraphs.filter(looksLikeAccountChunk);
        }
        var lines = normalized.split("\n").map(function (line) { return line.trim(); }).filter(Boolean);
        var chunks = [];
        var current = [];
        lines.forEach(function (line) {
          if (isLikelyAccountStart(line) && current.length) {
            chunks.push(current.join("\n"));
            current = [];
          }
          current.push(line);
        });
        if (current.length) chunks.push(current.join("\n"));
        return chunks.filter(looksLikeAccountChunk);
      }

      function looksLikeAccountChunk(chunk) {
        return /account|creditor|collector|collection|balance|past due|status|opened|delinquent|charge[- ]?off|late payment|settled/i.test(chunk || "");
      }

      function isLikelyAccountStart(line) {
        return /^(account name|account|tradeline|item)\s*[:#-]/i.test(line || "");
      }

      function parseReportChunk(chunk) {
        var clean = stripSensitiveText(chunk);
        var bureau = firstMatch(clean, /\b(Experian|Equifax|TransUnion)\b/i);
        bureau = bureau ? titleBureau(bureau) : detectBureauFromContext(clean);
        var collectionAgency = extractField(clean, ["Collection Agency", "Collector", "Collection Company"]);
        var creditorName = extractField(clean, ["Account Name", "Creditor", "Furnisher", "Company", "Name"]);
        var accountName = collectionAgency || creditorName || firstLikelyName(clean);
        var item = {
          id: createId(),
          selected: false,
          source: "credit-report-analysis",
          accountName: accountName,
          accountNumber: extractField(clean, ["Account Number", "Account #", "Acct #", "Acct No", "Reference Number"]),
          originalCreditor: extractField(clean, ["Original Creditor", "Original Lender"]),
          collectionAgency: collectionAgency,
          currentCreditor: extractField(clean, ["Current Creditor", "Current Owner", "Debt Buyer"]),
          claimedBalance: extractMoneyField(clean, ["Balance", "Current Balance", "Amount Owed", "Amount Claimed"]),
          pastDueAmount: extractMoneyField(clean, ["Past Due", "Past Due Amount"]),
          statusReported: extractField(clean, ["Account Status", "Status", "Account Condition"]),
          paymentStatus: extractField(clean, ["Payment Status", "Pay Status"]),
          dateOpened: extractDateField(clean, ["Date Opened", "Opened"]),
          dateClosed: extractDateField(clean, ["Date Closed", "Closed"]),
          dateFirstDelinquent: extractDateField(clean, ["Date First Delinquent", "First Delinquency", "DOFD"]),
          lastPaymentDate: extractDateField(clean, ["Last Payment", "Last Payment Date"]),
          bureau: bureau || "Not sure",
          possibleIssue: "",
          confidence: "Low",
          mainReason: "other_error",
          itemKind: "Other credit report error",
          notes: ""
        };
        classifyAnalysisItem(item, clean);
        return item;
      }

      function classifyAnalysisItem(item, text) {
        var issues = [];
        var lower = (text || "").toLowerCase();
        var hasBalance = numericMoney(item.claimedBalance) > 0;
        if (/collection|collector|debt buyer/.test(lower) || item.collectionAgency) {
          item.itemKind = "Collection account";
          issues.push("Collection account");
          if (!item.originalCreditor) {
            issues.push("Collection agency reporting without clear original creditor");
            item.mainReason = "not_validated";
          }
        }
        if (/charge[- ]?off|charged off/.test(lower)) {
          item.itemKind = "Charge-off account";
          issues.push("Charge-off account");
          if (item.mainReason === "other_error") item.mainReason = "wrong_status";
        }
        if (/late payment|30 days late|60 days late|90 days late|120 days late|late\s*[:\-]/.test(lower)) {
          item.itemKind = "Late payment";
          issues.push("Late payment");
          if (item.mainReason === "other_error") item.mainReason = "wrong_status";
        }
        if (/paid|settled|settlement|paid in full|paid as agreed/.test(lower) && hasBalance) {
          item.itemKind = "Paid or settled account reporting wrong";
          issues.push("Paid or settled language with balance still shown");
          item.mainReason = "paid_wrong";
        }
        if (/original creditor\s*[:\-]\s*(unknown|not listed|n\/a|none|--)?\s*$/im.test(text) || (!item.originalCreditor && item.itemKind === "Collection account")) {
          issues.push("Original creditor missing or unclear");
          if (item.mainReason === "other_error") item.mainReason = "wrong_original_creditor";
        }
        if (bureauBalanceMismatch(text)) {
          issues.push("Different information across credit bureaus");
          item.mainReason = "bureau_mismatch";
        }
        if (/status.*(open|closed).*status.*(closed|open)|paid.*unpaid|settled.*balance/i.test(text)) {
          issues.push("Account status appears inconsistent");
          if (item.mainReason === "other_error") item.mainReason = "wrong_status";
        }
        if (isPossiblyObsolete(item.dateFirstDelinquent || item.dateClosed || item.dateOpened)) {
          issues.push("Possible obsolete reporting based on visible dates");
          item.mainReason = "too_old";
        }
        if (!issues.length) {
          issues.push("Other credit report error");
          item.mainReason = item.mainReason || "other_error";
        }
        if (item.mainReason === "other_error") {
          if (/balance/i.test(text)) item.mainReason = "wrong_balance";
          else if (/date|opened|closed|delinquent/i.test(text)) item.mainReason = "wrong_dates";
        }
        item.possibleIssue = issues.join("; ");
        item.confidence = issues.length >= 2 || /collection|charge[- ]?off|late payment|settled|paid/i.test(text) ? "High" : (item.accountName && (item.claimedBalance || item.statusReported) ? "Medium" : "Low");
        item.notes = defaultAnalysisNote(item);
      }

      function applyDuplicateFlags(items) {
        var groups = {};
        items.forEach(function (item) {
          var key = normalizeAccountKey(item.accountName || item.originalCreditor || "");
          if (!key) return;
          groups[key] = groups[key] || [];
          groups[key].push(item);
        });
        Object.keys(groups).forEach(function (key) {
          if (groups[key].length < 2) return;
          groups[key].forEach(function (item) {
            item.itemKind = "Duplicate account";
            item.mainReason = "duplicate";
            item.possibleIssue = item.possibleIssue.indexOf("Duplicate or similar account names") >= 0
              ? item.possibleIssue
              : item.possibleIssue + "; Duplicate or similar account names";
            item.confidence = "High";
          });
        });
      }

      function draftFromAnalysisItem(item) {
        var draft = createEmptyDraft();
        draft.itemKind = item.itemKind || "Other credit report error";
        draft.recipient = recommendedRecipientFromAnalysis(item);
        draft.wrongs = unique([item.mainReason || "other_error"].concat(wrongsFromIssueText(item.possibleIssue || "")));
        draft.accountName = stripSensitiveText(item.accountName || item.collectionAgency || item.originalCreditor || "");
        draft.accountNumber = stripSensitiveText(item.accountNumber || "");
        draft.claimedBalance = stripSensitiveText(item.claimedBalance || "");
        draft.originalCreditor = stripSensitiveText(item.originalCreditor || "");
        draft.bureau = item.bureau || "Not sure";
        draft.desiredResult = desiredFromReason(item.mainReason);
        draft.explanation = stripSensitiveText(item.notes || defaultAnalysisNote(item));
        draft.supportingDocs = ["Copy of credit report page"];
        draft.advanced.currentCreditor = stripSensitiveText(item.currentCreditor || "");
        draft.advanced.dateOpened = item.dateOpened || "";
        draft.advanced.dateClosed = item.dateClosed || "";
        draft.advanced.dateFirstDelinquent = item.dateFirstDelinquent || "";
        draft.advanced.lastPaymentDate = item.lastPaymentDate || "";
        draft.advanced.extraNotes = "Created from credit report analysis. Extracted issue: " + stripSensitiveText(item.possibleIssue || "Possible factual issue.");
        return draft;
      }

      function recommendedRecipientFromAnalysis(item) {
        if ((item.mainReason === "not_validated" || item.mainReason === "no_authority") && (item.collectionAgency || item.itemKind === "Collection account")) return "Collection agency";
        if (item.bureau === "Experian" || item.bureau === "Equifax" || item.bureau === "TransUnion") return item.bureau;
        return "Experian";
      }

      function desiredFromReason(reason) {
        if (reason === "not_validated" || reason === "no_authority") return "Validate";
        if (reason === "duplicate" || reason === "too_old") return "Delete";
        if (reason === "paid_wrong" || reason === "wrong_status") return "Update";
        return "Correct";
      }

      function wrongsFromIssueText(text) {
        var lower = (text || "").toLowerCase();
        var wrongs = [];
        if (/balance/.test(lower)) wrongs.push("wrong_balance");
        if (/duplicate/.test(lower)) wrongs.push("duplicate");
        if (/date|obsolete|old/.test(lower)) wrongs.push("wrong_dates");
        if (/original creditor/.test(lower)) wrongs.push("wrong_original_creditor");
        if (/status|late|charge/.test(lower)) wrongs.push("wrong_status");
        if (/paid|settled/.test(lower)) wrongs.push("paid_wrong");
        if (/validat/.test(lower)) wrongs.push("not_validated");
        if (/authority/.test(lower)) wrongs.push("no_authority");
        if (/bureau|inconsistent|different/.test(lower)) wrongs.push("bureau_mismatch");
        return wrongs;
      }

      function defaultAnalysisNote(item) {
        return "The report text suggests a possible issue: " + (item.possibleIssue || "Other factual issue") + ". I want this reviewed for accuracy, completeness, verifiability, duplication, obsolescence, or inconsistency based on the report information and my records.";
      }

      function analysisSummaryText(items) {
        var lines = [
          "Credit Report Analysis Summary",
          "",
          "Generated: " + new Date().toLocaleString(),
          "",
          "This summary lists possible issues extracted locally from pasted or uploaded report text. Review all details before generating or sending any dispute letter.",
          ""
        ];
        (items || []).forEach(function (item, index) {
          lines.push((index + 1) + ". " + (item.accountName || "Unknown account"));
          lines.push("   Type: " + (item.itemKind || "Not set"));
          lines.push("   Bureau: " + (item.bureau || "Not sure"));
          lines.push("   Balance: " + (item.claimedBalance || "Not shown"));
          lines.push("   Status: " + (item.statusReported || "Not shown"));
          lines.push("   Possible issue: " + (item.possibleIssue || "Not set"));
          lines.push("   Confidence: " + (item.confidence || "Low"));
          lines.push("");
        });
        return lines.join("\n");
      }

      function findAnalysisItem(id) {
        return (state.analyzer.items || []).find(function (item) { return item.id === id; });
      }

      function extractField(text, labels) {
        for (var i = 0; i < labels.length; i += 1) {
          var escaped = labels[i].replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          var regex = new RegExp("(?:^|\\n)\\s*" + escaped + "\\s*[:#-]\\s*([^\\n]+)", "i");
          var match = text.match(regex);
          if (match && match[1]) return cleanExtractedValue(match[1]);
        }
        return "";
      }

      function extractMoneyField(text, labels) {
        var value = extractField(text, labels);
        if (value) {
          var money = value.match(/\$?\s*\d[\d,]*(?:\.\d{2})?/);
          return money ? money[0].replace(/\s+/g, "") : cleanExtractedValue(value);
        }
        var match = text.match(/\$\s*\d[\d,]*(?:\.\d{2})?/);
        return match ? match[0].replace(/\s+/g, "") : "";
      }

      function extractDateField(text, labels) {
        var value = extractField(text, labels);
        if (!value) return "";
        var match = value.match(/\b(?:\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4}|\d{4}[\/-]\d{1,2}[\/-]\d{1,2}|(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{1,2},?\s+\d{4})\b/i);
        return match ? match[0] : value.slice(0, 24);
      }

      function firstMatch(text, regex) {
        var match = text.match(regex);
        return match ? match[1] || match[0] : "";
      }

      function firstLikelyName(text) {
        var lines = text.split("\n").map(function (line) { return cleanExtractedValue(line); }).filter(Boolean);
        for (var i = 0; i < lines.length; i += 1) {
          if (!/^(account|balance|status|date|opened|closed|past due|payment|bureau|credit report|transunion|experian|equifax)\b/i.test(lines[i])) {
            return stripSensitiveText(lines[i]).slice(0, 80);
          }
        }
        return "";
      }

      function detectBureauFromContext(text) {
        if (/experian/i.test(text)) return "Experian";
        if (/equifax/i.test(text)) return "Equifax";
        if (/transunion|trans union/i.test(text)) return "TransUnion";
        return "Not sure";
      }

      function titleBureau(value) {
        if (/experian/i.test(value)) return "Experian";
        if (/equifax/i.test(value)) return "Equifax";
        if (/transunion|trans union/i.test(value)) return "TransUnion";
        return "Not sure";
      }

      function bureauBalanceMismatch(text) {
        var matches = Array.from(text.matchAll(/\b(Experian|Equifax|TransUnion)\b[^\n$]{0,60}\$?\s*(\d[\d,]*(?:\.\d{2})?)/gi));
        var values = matches.map(function (match) { return match[2].replace(/[,$]/g, ""); });
        return values.length > 1 && unique(values).length > 1;
      }

      function numericMoney(value) {
        var number = String(value || "").replace(/[^0-9.]/g, "");
        return number ? Number(number) || 0 : 0;
      }

      function isPossiblyObsolete(value) {
        if (!value) return false;
        var date = new Date(value);
        if (Number.isNaN(date.getTime())) return false;
        var cutoff = new Date();
        cutoff.setFullYear(cutoff.getFullYear() - 7);
        return date < cutoff;
      }

      function normalizeAccountKey(value) {
        return String(value || "").toLowerCase().replace(/[^a-z0-9]/g, "").replace(/(inc|llc|corp|company|bank|na)$/i, "").slice(0, 24);
      }

      function cleanExtractedValue(value) {
        return stripSensitiveText(String(value || "").replace(/\s+/g, " ").trim().replace(/[|•]+$/g, ""));
      }

      function stripSensitiveText(value) {
        return String(value || "")
          .replace(/\b\d{3}[- ]?\d{2}[- ]?\d{4}\b/g, "[full SSN removed]")
          .replace(/\b\d{9}\b/g, "[full SSN removed]");
      }

      function loadState() {
        try {
          var stored = window.localStorage.getItem(STORAGE_KEY);
          if (!stored) return defaultState();
          return normalizeState(JSON.parse(stored));
        } catch (error) {
          return defaultState();
        }
      }

      function saveState() {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function defaultState() {
        return {
          screen: "home",
          step: 1,
          personal: { fullName: "", mailingAddress: "", cityStateZip: "", contact: "" },
          draft: createEmptyDraft(),
          currentLetter: null,
          disputes: [],
          letters: [],
          tracker: [],
          analyzer: {
            items: [],
            summary: {},
            fullSsnWarning: "",
            lastAnalyzedAt: ""
          }
        };
      }

      function createEmptyDraft() {
        var now = new Date().toISOString();
        return {
          id: createId(),
          createdAt: now,
          updatedAt: now,
          itemKind: "Collection account",
          recipient: "Experian",
          wrongs: [],
          accountName: "",
          accountNumber: "",
          claimedBalance: "",
          originalCreditor: "",
          bureau: "Experian",
          explanation: "",
          desiredResult: "Correct",
          supportingDocs: [],
          status: "Draft",
          letterType: "",
          letterBody: "",
          advanced: {
            dateOpened: "",
            dateClosed: "",
            dateFirstDelinquent: "",
            lastPaymentDate: "",
            currentCreditor: "",
            previousDisputeDate: "",
            certifiedMailNumber: "",
            extraNotes: ""
          }
        };
      }

      function normalizeState(raw) {
        var base = defaultState();
        raw = raw && typeof raw === "object" ? raw : {};
        base.screen = ["home", "wizard", "preview", "saved", "tracker", "analyze"].indexOf(raw.screen) >= 0 ? raw.screen : "home";
        base.step = Math.min(5, Math.max(1, Number(raw.step || 1) || 1));
        base.personal = normalizePersonal(raw.personal || raw.personalInfo || {});
        base.draft = normalizeDraft(raw.draft || raw.current || createEmptyDraft());
        base.currentLetter = raw.currentLetter ? normalizeLetter(raw.currentLetter) : null;
        base.disputes = Array.isArray(raw.disputes) ? raw.disputes.map(normalizeDraft) : [];
        if (!base.disputes.length && Array.isArray(raw.items)) base.disputes = raw.items.map(oldItemToDraft);
        base.letters = Array.isArray(raw.letters) ? raw.letters.map(normalizeLetter) : [];
        base.tracker = Array.isArray(raw.tracker) ? raw.tracker.map(normalizeTracker) : [];
        base.analyzer = normalizeAnalyzer(raw.analyzer || {});
        if (base.screen === "preview" && !base.currentLetter) base.screen = "home";
        return base;
      }

      function normalizeAnalyzer(raw) {
        raw = raw && typeof raw === "object" ? raw : {};
        return {
          items: Array.isArray(raw.items) ? raw.items.map(normalizeAnalysisItem) : [],
          summary: raw.summary && typeof raw.summary === "object" ? raw.summary : {},
          fullSsnWarning: raw.fullSsnWarning || "",
          lastAnalyzedAt: raw.lastAnalyzedAt || ""
        };
      }

      function normalizeAnalysisItem(raw) {
        raw = raw && typeof raw === "object" ? raw : {};
        var item = {
          id: raw.id || createId(),
          selected: Boolean(raw.selected),
          source: raw.source || "credit-report-analysis",
          accountName: stripSensitiveText(raw.accountName || ""),
          accountNumber: stripSensitiveText(raw.accountNumber || ""),
          originalCreditor: stripSensitiveText(raw.originalCreditor || ""),
          collectionAgency: stripSensitiveText(raw.collectionAgency || ""),
          currentCreditor: stripSensitiveText(raw.currentCreditor || ""),
          claimedBalance: stripSensitiveText(raw.claimedBalance || ""),
          pastDueAmount: stripSensitiveText(raw.pastDueAmount || ""),
          statusReported: stripSensitiveText(raw.statusReported || ""),
          paymentStatus: stripSensitiveText(raw.paymentStatus || ""),
          dateOpened: raw.dateOpened || "",
          dateClosed: raw.dateClosed || "",
          dateFirstDelinquent: raw.dateFirstDelinquent || "",
          lastPaymentDate: raw.lastPaymentDate || "",
          bureau: raw.bureau || "Not sure",
          possibleIssue: stripSensitiveText(raw.possibleIssue || ""),
          confidence: raw.confidence || "Low",
          mainReason: raw.mainReason || "other_error",
          itemKind: itemKinds.indexOf(raw.itemKind) >= 0 ? raw.itemKind : "Other credit report error",
          notes: stripSensitiveText(raw.notes || "")
        };
        if (!item.notes) item.notes = defaultAnalysisNote(item);
        return item;
      }

      function normalizePersonal(raw) {
        raw = raw && typeof raw === "object" ? raw : {};
        return {
          fullName: raw.fullName || "",
          mailingAddress: raw.mailingAddress || "",
          cityStateZip: raw.cityStateZip || "",
          contact: raw.contact || raw.email || raw.phone || ""
        };
      }

      function normalizeDraft(raw) {
        raw = raw && typeof raw === "object" ? raw : {};
        var empty = createEmptyDraft();
        var draft = Object.assign(empty, raw || {});
        draft.id = draft.id || createId();
        draft.itemKind = itemKinds.indexOf(draft.itemKind) >= 0 ? draft.itemKind : convertOldItemKind(raw.itemType);
        draft.recipient = recipients.indexOf(draft.recipient) >= 0 ? draft.recipient : convertOldRecipient(raw.preferredRecipient);
        draft.wrongs = Array.isArray(draft.wrongs) ? draft.wrongs : convertOldWrongs(raw.disputeReasons, raw.disputedFields, raw.disputeReason);
        draft.accountName = draft.accountName || raw.collectionAgencyName || raw.furnisherName || raw.currentCreditor || raw.originalCreditor || "";
        draft.accountNumber = draft.accountNumber || raw.accountReference || "";
        draft.claimedBalance = draft.claimedBalance || "";
        draft.originalCreditor = draft.originalCreditor || "";
        draft.bureau = draft.bureau || (Array.isArray(raw.bureaus) ? raw.bureaus[0] : "Experian") || "Experian";
        draft.explanation = draft.explanation || raw.specificFactualError || raw.bureauErrorSummary || "";
        draft.desiredResult = desiredResults.indexOf(draft.desiredResult) >= 0 ? draft.desiredResult : convertOldDesired(raw.desiredOutcome);
        draft.supportingDocs = (Array.isArray(draft.supportingDocs) ? draft.supportingDocs : (Array.isArray(raw.supportingDocuments) ? raw.supportingDocuments : [])).map(enclosureLabel);
        draft.advanced = Object.assign(empty.advanced, raw.advanced || {});
        draft.advanced.dateOpened = draft.advanced.dateOpened || raw.dateOpened || "";
        draft.advanced.dateClosed = draft.advanced.dateClosed || raw.dateClosed || "";
        draft.advanced.dateFirstDelinquent = draft.advanced.dateFirstDelinquent || raw.dateFirstDelinquent || "";
        draft.advanced.lastPaymentDate = draft.advanced.lastPaymentDate || raw.lastPaymentDate || "";
        draft.advanced.currentCreditor = draft.advanced.currentCreditor || raw.currentCreditor || "";
        draft.advanced.extraNotes = draft.advanced.extraNotes || raw.notes || "";
        return draft;
      }

      function oldItemToDraft(item) {
        return normalizeDraft(item);
      }

      function normalizeLetter(raw) {
        raw = raw && typeof raw === "object" ? raw : {};
        return {
          id: raw.id || createId(),
          disputeId: raw.disputeId || raw.recordId || raw.itemId || "",
          accountName: raw.accountName || "",
          recipient: raw.recipient || raw.recipientName || "",
          letterType: raw.letterType || "Credit bureau dispute letter",
          createdAt: raw.createdAt || new Date().toISOString(),
          body: raw.body || ""
        };
      }

      function normalizeTracker(raw) {
        raw = raw && typeof raw === "object" ? raw : {};
        var mailed = raw.dateMailed || "";
        var baseDate = mailed || raw.dateGenerated || raw.dateCreated || isoDate();
        return {
          id: raw.id || createId(),
          disputeId: raw.disputeId || raw.recordId || raw.disputeItemId || "",
          accountName: raw.accountName || "",
          recipient: raw.recipient || "",
          letterType: raw.letterType || "Credit bureau dispute letter",
          dateMailed: mailed,
          trackingNumber: raw.trackingNumber || raw.certifiedMailTracking || "",
          responseDeadline: raw.responseDeadline || raw.followUpDate || addDays(baseDate, 30),
          followUpDate: raw.followUpDate || raw.responseDeadline || addDays(baseDate, 30),
          extendedDeadline: raw.extendedDeadline || addDays(baseDate, 45),
          responseReceived: raw.responseReceived || "No response yet",
          result: raw.result || "Pending",
          nextAction: raw.nextAction || raw.nextRecommendedAction || "Mail the letter, keep copies, and calendar the response deadline."
        };
      }

      function convertOldItemKind(value) {
        if (value === "Furnisher") return "Charge-off account";
        if (value === "Goodwill") return "Late payment";
        return "Collection account";
      }

      function convertOldRecipient(value) {
        if (recipients.indexOf(value) >= 0) return value;
        if (value === "Collection agency") return "Collection agency";
        if (value === "Original creditor/furnisher") return "Original creditor / furnisher";
        return "Experian";
      }

      function convertOldDesired(value) {
        if (/delete/i.test(value || "")) return "Delete";
        if (/valid/i.test(value || "")) return "Validate";
        if (/update/i.test(value || "")) return "Update";
        if (/investigate/i.test(value || "")) return "Investigate";
        return "Correct";
      }

      function convertOldWrongs(reasons, fields, singleReason) {
        var text = []
          .concat(Array.isArray(reasons) ? reasons : [])
          .concat(Array.isArray(fields) ? fields : [])
          .concat(singleReason || "")
          .join(" ")
          .toLowerCase();
        var wrongs = [];
        if (/balance/.test(text)) wrongs.push("wrong_balance");
        if (/not mine|ownership|liability/.test(text)) wrongs.push("not_mine");
        if (/duplicate/.test(text)) wrongs.push("duplicate");
        if (/date/.test(text)) wrongs.push("wrong_dates");
        if (/original creditor/.test(text)) wrongs.push("wrong_original_creditor");
        if (/status/.test(text)) wrongs.push("wrong_status");
        if (/paid|settled/.test(text)) wrongs.push("paid_wrong");
        if (/validated|validation/.test(text)) wrongs.push("not_validated");
        if (/authority/.test(text)) wrongs.push("no_authority");
        if (/bureau|inconsistent|differs/.test(text)) wrongs.push("bureau_mismatch");
        if (/old|obsolete/.test(text)) wrongs.push("too_old");
        return unique(wrongs);
      }

      function copyDraft(draft) {
        return normalizeDraft(JSON.parse(JSON.stringify(draft)));
      }

      function findDispute(id) {
        return state.disputes.find(function (item) { return item.id === id; });
      }

      function findTracker(id) {
        return state.tracker.find(function (item) { return item.id === id; });
      }

      function toggleArray(array, value, checkedValue) {
        if (checkedValue && array.indexOf(value) === -1) array.push(value);
        if (!checkedValue) {
          var index = array.indexOf(value);
          if (index >= 0) array.splice(index, 1);
        }
      }

      function createId() {
        return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 9);
      }

      function isoDate(date) {
        var d = date ? new Date(date) : new Date();
        return d.toISOString().slice(0, 10);
      }

      function addDays(dateText, days) {
        var d = dateText ? new Date(dateText + "T00:00:00") : new Date();
        d.setDate(d.getDate() + days);
        return isoDate(d);
      }

      function formatDate(value) {
        return value ? String(value).slice(0, 10) : "Not set";
      }

      function unique(items) {
        return items.filter(function (item, index) { return items.indexOf(item) === index; });
      }

      function checked(value) {
        return value ? "checked" : "";
      }

      function selected(value) {
        return value ? "selected" : "";
      }

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, "&#096;");
      }

      function registerPwa() {
        if (APP_BUILD !== "online" || isFileMode() || !("serviceWorker" in navigator)) return;
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").catch(function () {});
        });
      }
    })();
  </script>
</body>
